[project]
name = "pad"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
description = ""
authors = []
maintainers = []
readme = "README.md"
dependencies = [
  "fastapi >=0.122.0,<1",
  "uvicorn[standard] >=0.38.0,<1",
  "pydantic >=2.12.5,<3",
  "pydantic-settings >=2.12.0,<3",
  "yarl >=1.22.0,<2",
  "ujson >=5.11.0,<6",
  "httptools >=0.7.1,<1",
  "motor >=3.7.0,<4",
  "pymongo >=4.15.4,<5",
  "sqlalchemy[asyncio] >=2.0.0,<3",
  "asyncpg >=0.30.0,<1",
  "alembic >=1.16.0,<2",
  "qdrant-client >=1.14.0,<2",
  "minio >=7.2.0,<8",
  "python-multipart>=0.0.27",
  "sentence-transformers>=5.2.3",
  "python-dotenv>=1.2.2",
  "groq>=1.0.0",
  "requests>=2.32.5",
  "apscheduler>=3.11.2",
  "langgraph>=1.1.6",
  "llama-cpp-python>=0.3.20",
  "langgraph-checkpoint-sqlite>=3.0.3",
  "openai>=2.36.0",
  "yt-dlp>=2026.3.17",
  "pillow>=12.2.0",
  "beautifulsoup4>=4.14.3",
  "playwright>=1.60.0",
  "instaloader>=4.15.1",
  "apify-client>=3.0.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest >=9.0.1,<10",
  "ruff >=0.14.6,<1",
  "mypy >=1.19.0,<2",
  "pre-commit >=4.5.0,<5",
  "pytest-cov >=7.0.0,<8",
  "anyio >=4.11.0,<5",
  "pytest-env >=1.2.0,<2",
  "httpx >=0.28.1,<1",
]


[tool.uv]
default-groups = ["dev"]

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["app",]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true

[tool.pytest.ini_options]
addopts = "-p no:unraisableexception"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]
anyio_mode = "auto"
env = [
    "PAD_ENVIRONMENT=pytest",
    "PAD_DB_BASE=admin",
]

[tool.ruff]
target-version = "py313"
lint.select = [ "E",
    "F",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "ANN",
    "S",
    "B",
    "C4",
    "ISC",
    "PIE",
    "T20",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "PTH",
    "ERA",
    "PL",
    "RUF",
	"FA102",
	"UP",
]
lint.ignore = [
    "D105",
    "D107",
    "B008",
    "D211",
    "D212",
    "D401",
    "D104",
    "D100",
    "D202",
    "ANN401",
    "PLR0913",
    "D106",
    "D101",
    "D102",
    "D103",
]
lint.mccabe = { max-complexity = 10 }
exclude = [
    ".venv/"
]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
	"PLC0415",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
]

[fastapi-template.options]
project_name = "pad"
api_type = "rest"
enable_redis = "None"
enable_rmq = "None"
ci_type = "github"
enable_migrations = "None"
enable_taskiq = "None"
enable_routers = "None"
enable_kafka = "None"
enable_loguru = "None"
traefik_labels = "None"
add_dummy = "None"
orm = "none"
self_hosted_swagger = "None"
prometheus_enabled = "None"
sentry_enabled = "None"
otlp_enabled = "None"
gunicorn = "None"
add_users = "None"
cookie_auth = "None"
jwt_auth = "None"
