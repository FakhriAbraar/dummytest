name: Testing pad

on: push

jobs:
  lint:
    strategy:
      matrix:
        cmd:
          - ruff-format
          - ruff
          - mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: uv sync --all-groups

      - name: Run lint check
        run: uv run pre-commit run -a ${{ matrix.cmd }}

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: touch .env

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest -vv
